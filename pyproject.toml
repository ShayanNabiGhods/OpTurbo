[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opturbo"
version = "0.0.1"
description = "GUI-driven DAWT geometry, meshing, CFD/BEM, and GA optimization"
requires-python = ">=3.10"

[project.scripts]
opturbo = "opturbo.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
